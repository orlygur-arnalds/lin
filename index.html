<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lin Clothing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#">LIN</a>
    <nav>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
      <a href="#cart">Cart (0)</a>
    </nav>
  </header>

  <section class="hero">
    <h1>New Season</h1>
    <p>Hover over a piece to see the back.</p>
  </section>

  <main id="shop" class="grid">
    <!--
      To add a product: copy one <article> block and change the two image paths.
      The first <img> is the front, the second (class="back") is shown on hover.
    -->
    <article class="product">
      <div class="product-image" tabindex="0">
        <img class="front" src="images/tee-front.svg" alt="Coral Tee, front">
        <img class="back" src="images/tee-back.svg" alt="Coral Tee, back">
        <span class="badge">Back view</span>
      </div>
      <h2>Coral Tee</h2>
      <p class="price">$29</p>
    </article>

    <article class="product">
      <div class="product-image" tabindex="0">
        <img class="front" src="images/hoodie-front.svg" alt="Lime Hoodie, front">
        <img class="back" src="images/hoodie-back.svg" alt="Lime Hoodie, back">
        <span class="badge">Back view</span>
      </div>
      <h2>Lime Hoodie</h2>
      <p class="price">$59</p>
    </article>

    <article class="product">
      <div class="product-image" tabindex="0">
        <img class="front" src="images/jacket-front.svg" alt="Orange Jacket, front">
        <img class="back" src="images/jacket-back.svg" alt="Orange Jacket, back">
        <span class="badge">Back view</span>
      </div>
      <h2>Orange Jacket</h2>
      <p class="price">$119</p>
    </article>

    <article class="product">
      <div class="product-image" tabindex="0">
        <img class="front" src="images/dress-front.svg" alt="Pink Dress, front">
        <img class="back" src="images/dress-back.svg" alt="Pink Dress, back">
        <span class="badge">Back view</span>
      </div>
      <h2>Pink Dress</h2>
      <p class="price">$79</p>
    </article>
  </main>

  <footer id="about" class="site-footer">
    <p>&copy; 2026 Lin Clothing</p>
  </footer>

  <script>
    // Touch screens have no hover: tap a picture to toggle front/back.
    document.querySelectorAll('.product-image').forEach(function (card) {
      card.addEventListener('click', function () {
        card.classList.toggle('show-back');
      });
    });
  </script>
</body>
</html>
